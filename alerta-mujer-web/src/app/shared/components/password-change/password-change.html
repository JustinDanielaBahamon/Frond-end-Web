<div class="pc-backdrop" (click)="cerrar.emit()">
  <section class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-titulo" (click)="$event.stopPropagation()">
    <header class="pc-head">
      <span class="pc-head__icon"><i class="ti ti-lock"></i></span>
      <div>
        <h2 id="pc-titulo">Cambiar contraseña</h2>
        <p>Usa una contraseña que no uses en otras páginas.</p>
      </div>
      <button type="button" class="pc-close" (click)="cerrar.emit()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
    </header>

    @if (listo()) {
      <div class="pc-ok">
        <span class="pc-ok__icon"><i class="ti ti-circle-check"></i></span>
        <h3>Contraseña actualizada</h3>
        <p>La próxima vez que inicies sesión, en la web o en la app, usa tu nueva contraseña.</p>
        <button type="button" class="pc-btn pc-btn--primary" (click)="cerrar.emit()">Listo</button>
      </div>
    } @else {
      <form class="pc-form" (ngSubmit)="guardar()">
        <label class="pc-field">
          <span>Contraseña actual</span>
          <div class="pc-input">
            <input [type]="ver().actual ? 'text' : 'password'" name="actual" autocomplete="current-password"
                   [ngModel]="actual()" (ngModelChange)="actual.set($event)" required />
            <button type="button" (click)="alternar('actual')" [attr.aria-label]="ver().actual ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!ver().actual" [class.ti-eye-off]="ver().actual"></i>
            </button>
          </div>
        </label>

        <label class="pc-field">
          <span>Nueva contraseña</span>
          <div class="pc-input">
            <input [type]="ver().nueva ? 'text' : 'password'" name="nueva" autocomplete="new-password"
                   [ngModel]="nueva()" (ngModelChange)="nueva.set($event)" required />
            <button type="button" (click)="alternar('nueva')" [attr.aria-label]="ver().nueva ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!ver().nueva" [class.ti-eye-off]="ver().nueva"></i>
            </button>
          </div>
        </label>

        <app-password-strength [clave]="nueva()" />

        <label class="pc-field">
          <span>Confirmar nueva contraseña</span>
          <div class="pc-input" [class.pc-input--error]="confirmar() && !coinciden()">
            <input [type]="ver().confirmar ? 'text' : 'password'" name="confirmar" autocomplete="new-password"
                   [ngModel]="confirmar()" (ngModelChange)="confirmar.set($event)" required />
            <button type="button" (click)="alternar('confirmar')" [attr.aria-label]="ver().confirmar ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!ver().confirmar" [class.ti-eye-off]="ver().confirmar"></i>
            </button>
          </div>
          @if (confirmar() && !coinciden()) {
            <small class="pc-hint pc-hint--error">Las contraseñas no coinciden.</small>
          }
          @if (nueva() && actual() && nueva() === actual()) {
            <small class="pc-hint pc-hint--error">La nueva contraseña debe ser distinta de la actual.</small>
          }
        </label>

        @if (error()) {
          <p class="pc-error" role="alert"><i class="ti ti-alert-circle"></i> {{ error() }}</p>
        }

        <footer class="pc-actions">
          <button type="button" class="pc-btn pc-btn--ghost" (click)="cerrar.emit()">Cancelar</button>
          <button type="submit" class="pc-btn pc-btn--primary" [disabled]="!puedeGuardar()">
            {{ enviando() ? 'Guardando…' : 'Guardar contraseña' }}
          </button>
        </footer>
      </form>
    }
  </section>
</div>
