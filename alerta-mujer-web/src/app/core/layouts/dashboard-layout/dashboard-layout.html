<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <aside class="sidebar">
    <div class="sidebar__header">
      <p class="sidebar__section">Modulo</p>
      <div class="sidebar__divider"></div>
    </div>
    <nav class="sidebar__nav">
      <a routerLink="/dashboard" routerLinkActive="sidebar__link--active"
         [routerLinkActiveOptions]="{exact:true}" class="sidebar__link">
        Dashboard
      </a>
      <a routerLink="/dashboard/phone-location" routerLinkActive="sidebar__link--active"
         class="sidebar__link">
        Ubicación del teléfono
      </a>
      <a routerLink="/dashboard/alert-history" routerLinkActive="sidebar__link--active"
         class="sidebar__link">
        Historial de Alerta
      </a>
      <a routerLink="/dashboard/evidence" routerLinkActive="sidebar__link--active"
        class="sidebar__link">
        Evidencias
      </a>
    </nav>
  </aside>

  <div class="layout__body">
    <header class="topbar">
      <div class="topbar__left">
        <button class="topbar__hamburger" (click)="toggleSidebar()" title="Menú">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <img src="/logo.png" alt="AlertaMujer" class="topbar__logo w-10 h-10" />
        <span class="topbar__brand">Alerta Mujer</span>
      </div>
      <div class="topbar__actions">
        <button class="topbar__btn" title="Cambiar tema" (click)="toggleTheme()">
          @if (isDark) {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          }
        </button>
        <div class="topbar__avatar">S</div>
        <span class="topbar__username">Ver Perfil</span>
      </div>
    </header>

    <main class="layout__main">
      <router-outlet></router-outlet>
    </main>

    <nav class="bottom-nav">
      <a routerLink="/dashboard" routerLinkActive="bottom-nav__item--active"
         [routerLinkActiveOptions]="{exact:true}" class="bottom-nav__item">
        <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/dashboard/alert-history" routerLinkActive="bottom-nav__item--active"
         class="bottom-nav__item">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span>Alertas</span>
      </a>
      <a routerLink="/dashboard/phone-location" routerLinkActive="bottom-nav__item--active"
         class="bottom-nav__item">
        <i class="ti ti-map-pin" aria-hidden="true"></i>
        <span>Ubicación</span>
      </a>
      <a routerLink="/dashboard/device-status" routerLinkActive="bottom-nav__item--active"
          class="bottom-nav__item">
          <i class="ti ti-device-mobile" aria-hidden="true"></i>
        <span>Dispositivo</span>
      </a>
    </nav>

  </div>

</div>
