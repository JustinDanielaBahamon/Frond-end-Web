<div class="container-hero">

    <!-- CONTENIDO -->
    <div class="container-information">

        <div class="container-texts">

            <div class="container-text-main">
                <h1 class="text-banner">
                    {{ 'Tu seguridad,' | t }}
                    <br>
                    <span>{{ 'nuestra prioridad' | t }}</span>
                </h1>
            </div>

            <div class="container-text-second">
                <p>
                    {{ 'Alerta Mujer es la app que te acompaña y protege en todo momento. Envía alertas, comparte tu ubicación y recibe apoyo de tus contactos de confianza.' | t }}
                </p>
            </div>

            <div class="container-buttons">

                <button class="start-btn" routerLink="/auth/register">
                    {{ 'Comenzar ahora' | t }}
                </button>

                <button class="learn-btn">
                    {{ 'Conocer más' | t }}
                </button>

            </div>

            <div class="container-stats">

                <div class="img-stats">
                    <img src="mujerTWO.png" [alt]="'Mujer' | t">
                </div>

                <p>
                    {{ '+5000 mujeres ya confían en' | t }}
                    <b>{{ 'Alerta Mujer' | t }}</b>
                </p>

            </div>

        </div>

    </div>

</div>
