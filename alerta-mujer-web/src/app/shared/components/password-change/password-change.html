<div class="pc-backdrop" (click)="close.emit()">
  <section class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="pc-titulo" (click)="$event.stopPropagation()">
    <header class="pc-head">
      <span class="pc-head__icon"><i class="ti ti-lock"></i></span>
      <div>
        <h2 id="pc-titulo">{{ 'Cambiar contraseña' | t }}</h2>
        <p>{{ 'Usa una contraseña que no uses en otras páginas.' | t }}</p>
      </div>
      <button type="button" class="pc-close" (click)="close.emit()" [attr.aria-label]="'Cerrar' | t"><i class="ti ti-x"></i></button>
    </header>

    @if (ready()) {
      <div class="pc-ok">
        <span class="pc-ok__icon"><i class="ti ti-circle-check"></i></span>
        <h3>{{ 'Contraseña actualizada' | t }}</h3>
        <p>{{ 'La próxima vez que inicies sesión, en la web o en la app, usa tu nueva contraseña.' | t }}</p>
        <button type="button" class="pc-btn pc-btn--primary" (click)="close.emit()">{{ 'Listo' | t }}</button>
      </div>
    } @else {
      <form class="pc-form" (ngSubmit)="save()">
        <label class="pc-field">
          <span>{{ 'Contraseña actual' | t }}</span>
          <div class="pc-input">
            <input [type]="show().current ? 'text' : 'password'" name="actual" autocomplete="current-password"
                   [ngModel]="current()" (ngModelChange)="current.set($event)" required />
            <button type="button" (click)="toggle('current')" [attr.aria-label]="show().current ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!show().current" [class.ti-eye-off]="show().current"></i>
            </button>
          </div>
        </label>

        <label class="pc-field">
          <span>{{ 'Nueva contraseña' | t }}</span>
          <div class="pc-input">
            <input [type]="show().newPassword ? 'text' : 'password'" name="nueva" autocomplete="new-password"
                   [ngModel]="newOne()" (ngModelChange)="newOne.set($event)" required />
            <button type="button" (click)="toggle('newPassword')" [attr.aria-label]="show().newPassword ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!show().newPassword" [class.ti-eye-off]="show().newPassword"></i>
            </button>
          </div>
        </label>

        <app-password-strength [key]="newOne()" />

        <label class="pc-field">
          <span>{{ 'Confirmar nueva contraseña' | t }}</span>
          <div class="pc-input" [class.pc-input--error]="confirm() && !match()">
            <input [type]="show().confirm ? 'text' : 'password'" name="confirmar" autocomplete="new-password"
                   [ngModel]="confirm()" (ngModelChange)="confirm.set($event)" required />
            <button type="button" (click)="toggle('confirm')" [attr.aria-label]="show().confirm ? 'Ocultar' : 'Mostrar'">
              <i class="ti" [class.ti-eye]="!show().confirm" [class.ti-eye-off]="show().confirm"></i>
            </button>
          </div>
          @if (confirm() && !match()) {
            <small class="pc-hint pc-hint--error">{{ 'Las contraseñas no coinciden.' | t }}</small>
          }
          @if (newOne() && current() && newOne() === current()) {
            <small class="pc-hint pc-hint--error">{{ 'La nueva contraseña debe ser distinta de la actual.' | t }}</small>
          }
        </label>

        @if (error()) {
          <p class="pc-error" role="alert"><i class="ti ti-alert-circle"></i> {{ error() | t }}</p>
        }

        <footer class="pc-actions">
          <button type="button" class="pc-btn pc-btn--ghost" (click)="close.emit()">{{ 'Cancelar' | t }}</button>
          <button type="submit" class="pc-btn pc-btn--primary" [disabled]="!canSave()">
            {{ sending() ? 'Guardando…' : 'Guardar contraseña' | t }}
          </button>
        </footer>
      </form>
    }
  </section>
</div>
