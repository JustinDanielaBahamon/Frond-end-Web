<section class="review-section">
  <h2 class="title">Lo que dicen nuestras usuarias</h2>

  <div class="carousel-container" #carousel (mouseenter)="pauseAutoplay()" (mouseleave)="resumeAutoplay()">
    <button class="nav-button prev" (click)="prevSlide()" aria-label="Anterior">
      <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div class="carousel-viewport">
      <div class="carousel-track" #track>
        <div class="testimonial-card" *ngFor="let testimonial of testimonials">
          <div class="stars">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
          </div>
          <p class="comment">{{ testimonial.comment }}</p>
          <div class="user-info">
            <img [src]="testimonial.image" [alt]="testimonial.name" class="user-avatar">
            <span class="user-name">{{ testimonial.name }}</span>
          </div>
        </div>
      </div>
    </div>

    <button class="nav-button next" (click)="nextSlide()" aria-label="Siguiente">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>

  <div class="carousel-dots">
    <span
      *ngFor="let i of [].constructor(maxIndex + 1); let index = index"
      class="dot"
      [class.active]="currentIndex === index"
      (click)="goToSlide(index)">
    </span>
  </div>
</section>
