<div class="pc-backdrop" (click)="exit()">
  <section class="pc-modal" role="dialog" aria-modal="true" aria-labelledby="ec-titulo" (click)="$event.stopPropagation()">
    <header class="pc-head">
      <span class="pc-head__icon"><i class="ti ti-trash"></i></span>
      <div>
        <h2 id="ec-titulo">¿Eliminar tu cuenta?</h2>
        <p>Se cerrará tu sesión en la web y en la app, en todos tus dispositivos.</p>
      </div>
      <button type="button" class="pc-close" (click)="exit()" aria-label="Cerrar"><i class="ti ti-x"></i></button>
    </header>

    <form class="pc-form" (ngSubmit)="delete()">
      <ul class="ec-list">
        @for (line of whatGetsDeleted; track line) {
          <li><i class="ti ti-circle-x"></i><span>{{ line }}</span></li>
        }
      </ul>
      <p class="ec-notice">Esto no se puede deshacer. Tus alertas quedan solo como un registro anónimo.</p>

      <label class="pc-field">
        <span>Escribe <strong>{{ word }}</strong> para confirmar</span>
        <div class="pc-input">
          <input name="confirmacion" autocomplete="off" [placeholder]="word" [disabled]="deleting()"
                 [ngModel]="text()" (ngModelChange)="text.set($event)" />
        </div>
      </label>

      @if (error()) {
        <p class="pc-error"><i class="ti ti-alert-circle"></i>{{ error() }}</p>
      }

      <div class="pc-actions">
        <button type="button" class="pc-btn pc-btn--ghost" (click)="exit()" [disabled]="deleting()">Cancelar</button>
        <button type="submit" class="pc-btn pc-btn--primary" [disabled]="!ready() || deleting()">
          {{ deleting() ? 'Eliminando…' : 'Eliminar definitivamente' }}
        </button>
      </div>
    </form>
  </section>
</div>
