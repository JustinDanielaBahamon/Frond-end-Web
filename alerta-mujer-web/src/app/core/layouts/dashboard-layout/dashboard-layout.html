<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed">

  <app-sidebar
    [links]="links"
    sectionTitle="Módulo"
    [collapsed]="sidebarCollapsed">
  </app-sidebar>

  <div class="layout__body">

    <app-topbar
      brand="Alerta Mujer"
      avatarLetter="S"
      (sidebarToggle)="toggleSidebar()"
      (themeToggle)="toggleTheme()">
    </app-topbar>

    <main class="layout__main">
      <router-outlet></router-outlet>
    </main>

    <nav class="bottom-nav">
      <a routerLink="/dashboard" routerLinkActive="bottom-nav__item--active"
         [routerLinkActiveOptions]="{exact:true}" class="bottom-nav__item">
        <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/dashboard/alert-history" routerLinkActive="bottom-nav__item--active"
         class="bottom-nav__item">
        <i class="ti ti-bell" aria-hidden="true"></i>
        <span>Alertas</span>
      </a>
      <a routerLink="/dashboard/phone-location" routerLinkActive="bottom-nav__item--active"
         class="bottom-nav__item">
        <i class="ti ti-map-pin" aria-hidden="true"></i>
        <span>Ubicación</span>
      </a>
      <a routerLink="/dashboard/device-status" routerLinkActive="bottom-nav__item--active"
         class="bottom-nav__item">
        <i class="ti ti-device-mobile" aria-hidden="true"></i>
        <span>Dispositivo</span>
      </a>
    </nav>
  </div>
</div>
