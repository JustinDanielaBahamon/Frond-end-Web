  <div class="login-page">

    <button
      class="back-btn"
      type="button"
      (click)="irAlLanding()"
      aria-label="Volver al inicio">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>

    <div class="login-page__wrapper">
      <div class="login-page__visual">
        <div class="halo halo--1"></div>
        <div class="halo halo--2"></div>
        <div class="halo halo--3"></div>

        <div class="podium"></div>

        <svg class="leaf leaf--left" viewBox="0 0 140 300" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="72" cy="270" rx="22" ry="9" transform="rotate(35 72 270)"/>
          <ellipse cx="64" cy="235" rx="20" ry="8" transform="rotate(-37 64 235)"/>
          <ellipse cx="72" cy="200" rx="18" ry="7" transform="rotate(39 72 200)"/>
          <ellipse cx="64" cy="165" rx="16" ry="6" transform="rotate(-41 64 165)"/>
          <ellipse cx="72" cy="130" rx="14" ry="5" transform="rotate(43 72 130)"/>
          <ellipse cx="64" cy="95"  rx="12" ry="5" transform="rotate(-45 64 95)"/>
          <ellipse cx="70" cy="60"  rx="10" ry="4" transform="rotate(47 70 60)"/>
          <ellipse cx="68" cy="30"  rx="8"  ry="3" transform="rotate(20 68 30)"/>
        </svg>

        <svg class="leaf leaf--right" viewBox="0 0 140 300" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="72" cy="270" rx="22" ry="9" transform="rotate(35 72 270)"/>
          <ellipse cx="64" cy="235" rx="20" ry="8" transform="rotate(-37 64 235)"/>
          <ellipse cx="72" cy="200" rx="18" ry="7" transform="rotate(39 72 200)"/>
          <ellipse cx="64" cy="165" rx="16" ry="6" transform="rotate(-41 64 165)"/>
          <ellipse cx="72" cy="130" rx="14" ry="5" transform="rotate(43 72 130)"/>
          <ellipse cx="64" cy="95"  rx="12" ry="5" transform="rotate(-45 64 95)"/>
          <ellipse cx="70" cy="60"  rx="10" ry="4" transform="rotate(47 70 60)"/>
          <ellipse cx="68" cy="30"  rx="8"  ry="3" transform="rotate(20 68 30)"/>
        </svg>

        <img class="hero-image hero-image-light" src="login.png" alt="Alerta Mujer">
        <img class="hero-image hero-image-dark" src="loginoscuro.png" alt="Alerta Mujer">

        <span class="spark spark--1">✦</span>
        <span class="spark spark--2">✦</span>
        <span class="spark spark--3">✦</span>
        <span class="spark spark--4">✦</span>
      </div>

      <app-card class="card">

        <div class="brand">
          <div class="brand__icon">
            <img src="logo.png" alt="Logo">
          </div>
          <div class="brand__text">
            <span class="brand__name">
              ALERTA<br><strong>MUJER</strong>
            </span>
            <span class="brand__tagline">Seguridad para todas</span>
          </div>
        </div>

        <h1 class="card__title">Inicia <span style="color:#d648ec">sesión</span></h1>
        <p class="card__subtitle">
          Accede a tu cuenta para continuar protegiendo lo que más importa.
        </p>

        <form
        class="form"
        (ngSubmit)="signIn()">
          <div class="field">

            <span class="field__icon">
                <i class="fa-regular fa-user"></i>
            </span>
        
            <input
                [(ngModel)]="email"
                (input)="validateEmail()"
                name="email"
                type="email"
                class="field__input"
                placeholder="Correo electrónico">
        
        </div>
        
        <p
            class="input-error"
            *ngIf="!validEmail">
        
            Ingresa un correo válido.
        
        </p>

        <div class="field">

          <span class="field__icon">
              <i class="fa-solid fa-lock"></i>
          </span>
      
          <input
      
              [(ngModel)]="password"
              (input)="validatePassword()"
              name="password"
              [type]="viewPassword ? 'text' : 'password'"
              class="field__input"
              placeholder="Contraseña">
      
          <button
      
              type="button"
              class="field__eye"
              (click)="showpassword()">
      
              <i
                  [class]="viewPassword
                      ? 'fa-regular fa-eye-slash'
                      : 'fa-regular fa-eye'">
              </i>
      
          </button>
      
      </div>
      
      <p
          class="input-error"
          *ngIf="!validPassword">
      
          Escribe tu contraseña.
      
      </p>

          <p *ngIf="error" style="color:#ce1ee9; font-size:0.85rem; margin-top:-0.5rem; margin-bottom:0.5rem;">
            {{ error }}
          </p>

          <div class="form__options">
            <label class="checkbox">
              <input type="checkbox">
              <span class="checkbox__mark"></span>
              <span class="checkbox__label">Recuérdame</span>
            </label>
            <span class="form__link" (click)="goToForgotPassword()">¿Olvidaste tu contraseña?</span>
          </div>

          <button
          type="submit"
          class="btn-submit">
      
          <i class="fa-solid fa-shield-halved"></i>
          INGRESAR
      
      </button>

          <div class="login-divider" aria-hidden="true"><span>o</span></div>

          <button type="button" class="btn-google" (click)="continueWithGoogle()" [disabled]="loadingGoogle">
            <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
              <path fill="#ac07ff" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
              <path fill="#dd00ff" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
              <path fill="#7226d5" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
              <path fill="#5119d2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>
            {{ loadingGoogle ? 'Conectando con Google…' : 'Continuar con Google' }}
          </button>

        </form>

        <p class="card__footer">
          ¿No tienes cuenta?
          <span class="form__link" (click)="goToRegister()">Crea una cuenta</span>
        </p>

      </app-card>
    </div>
  </div>
