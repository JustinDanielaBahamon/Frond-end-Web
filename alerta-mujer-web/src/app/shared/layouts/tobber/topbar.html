<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__hamburger" (click)="onToggleSidebar()" title="Menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="topbar__greeting">
      <span class="topbar__greeting-hi">Hola, {{ userName }} 👋</span>
      <span class="topbar__greeting-page">{{ pageTitle }}</span>
    </div>
  </div>

  <div class="topbar__actions">

    <!-- ═════════ NOTIFICACIONES ═════════ -->
    <div class="topbar__notif">
      @if (notifOpen) {
        <div class="profile-menu__overlay" (click)="closeNotif()"></div>
      }

      <button class="topbar__btn topbar__bell" title="Notificaciones" (click)="toggleNotif()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        @if (unreadCount > 0) {
          <span class="topbar__badge">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
        }
      </button>

      @if (notifOpen) {
        <div class="notif-menu">
          <div class="notif-menu__header">
            <p class="notif-menu__title">Notificaciones</p>
            @if (unreadCount > 0) {
              <button class="notif-menu__mark" (click)="markAllRead()">Marcar todas como leídas</button>
            }
          </div>

          <div class="notif-menu__list">
            @for (n of notifications; track n.id) {
              <button
                class="notif-item"
                [class.notif-item--unread]="!isRead(n)"
                (click)="onNotificationClick(n)">
                <span class="notif-item__dot"></span>
                <span class="notif-item__body">
                  <span class="notif-item__title">{{ n.title }}</span>
                  <span class="notif-item__msg">{{ n.message }}</span>
                  <span class="notif-item__time">{{ n.time }}</span>
                </span>
              </button>
            } @empty {
              <div class="notif-menu__empty">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <p>No tienes notificaciones</p>
              </div>
            }
          </div>
        </div>
      }
    </div>

    <!-- ═════════ TEMA ═════════ -->
    <button class="topbar__btn" title="Cambiar tema" (click)="onToggleTheme()">
      @if (isDark) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      }
    </button>

    <!-- ═════════ IDIOMA ═════════ -->
    <div class="topbar__profile">
      @if (menuOpen) {
        <div class="profile-menu__overlay" (click)="closeMenu()"></div>
      }

      <div class="topbar__avatar" (click)="toggleMenu()" title="Idioma">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <span class="topbar__username" (click)="toggleMenu()">Idioma</span>

      @if (menuOpen) {
        <div class="profile-menu">

          <!-- IDIOMA -->
          <div class="settings-section">
            <p class="settings-section__title">Idioma</p>
            <div class="settings-pills">
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'es'"
                (click)="setLanguage('es')">
                Español
              </button>
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'en'"
                (click)="setLanguage('en')">
                English
              </button>
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'fr'"
                (click)="setLanguage('fr')">
                Français
              </button>
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'pt'"
                (click)="setLanguage('pt')">
                Português
              </button>
            </div>
          </div>

          <div class="profile-menu__divider"></div>
          <button class="profile-menu__item profile-menu__item--danger" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
