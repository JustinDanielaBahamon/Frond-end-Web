<div class="login-page">
  <div class="bg-orb bg-orb--1"></div>
  <div class="bg-orb bg-orb--2"></div>

  <div class="login-page__wrapper">
    <div class="login-page__visual">
      <img src="login.png" alt="Alerta Mujer">
    </div>

    <app-card>

      <div class="brand">
        <div class="brand__icon">
          <img src="logo.png" alt="Logo">
        </div>
        <div class="brand__text">
          <span class="brand__name">
            ALERTA<br><strong>MUJER</strong>
          </span>
          <span class="brand__tagline">Seguridad para todas</span>
        </div>
      </div>

      <h1 class="card__title">Inicia <span style="color:#ec4899">sesión</span></h1>
      <p class="card__subtitle">
        Accede a tu cuenta para continuar protegiendo lo que más importa.
      </p>

      <form class="form">

        <div class="field">
          <span class="field__icon">
            <i class="fa-regular fa-user"></i>
          </span>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            class="field__input"
            placeholder="Correo electrónico o usuario"
          >
        </div>

        <div class="field">
          <span class="field__icon">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input
            [(ngModel)]="password"
            name="password"
            type="password"
            class="field__input"
            placeholder="Contraseña"
          >
          <button type="button" class="field__eye">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <p *ngIf="error" style="color:#E91E8C; font-size:0.85rem; margin-top:-0.5rem; margin-bottom:0.5rem;">
          {{ error }}
        </p>

        <div class="form__options">
          <label class="checkbox">
            <input type="checkbox">
            <span class="checkbox__mark"></span>
            <span class="checkbox__label">Recuérdame</span>
          </label>
          <span class="form__link" (click)="irAOlvidePassword()">¿Olvidaste tu contraseña?</span>
        </div>

        <button type="button" (click)="iniciarSesion()" class="btn-submit">
          <i class="fa-solid fa-shield-halved"></i>
          INGRESAR
        </button>

      </form>

      <p class="card__footer">
        ¿No tienes cuenta?
        <span class="form__link" (click)="irARegistro()">Crea una cuenta</span>
      </p>

    </app-card>
  </div>
</div>
