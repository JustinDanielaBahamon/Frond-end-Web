<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__hamburger" (click)="onToggleSidebar()" title="Menú">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="topbar__greeting">
      <span class="topbar__greeting-hi">Hola, {{ userName }} 👋</span>
      <span class="topbar__greeting-page">{{ pageTitle }}</span>
    </div>
  </div>

  <div class="topbar__actions">
    <button class="topbar__btn" title="Cambiar tema" (click)="onToggleTheme()">
      @if (isDark) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      }
    </button>

    <div class="topbar__profile">
      @if (menuOpen) {
        <div class="profile-menu__overlay" (click)="closeMenu()"></div>
      }

      <div class="topbar__avatar" (click)="toggleMenu()" title="Ajustes">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <span class="topbar__username" (click)="toggleMenu()">Ajustes</span>

      @if (menuOpen) {
        <div class="profile-menu">

          <!-- IDIOMA -->
          <div class="settings-section">
            <p class="settings-section__title">Idioma</p>
            <div class="settings-pills">
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'es'"
                (click)="setLanguage('es')">
                Español
              </button>
              <button
                class="settings-pill"
                [class.settings-pill--active]="settings.language() === 'en'"
                (click)="setLanguage('en')">
                English
              </button>
            </div>
          </div>

          <!-- ACCESIBILIDAD: TAMAÑO DE LETRA -->
          <div class="settings-section">
            <p class="settings-section__title">Tamaño de letra</p>
            <div class="settings-pills">
              <button
                class="settings-pill settings-pill--font"
                title="Pequeño"
                [class.settings-pill--active]="settings.fontSize() === 'sm'"
                (click)="setFontSize('sm')">
                A-
              </button>
              <button
                class="settings-pill settings-pill--font"
                title="Normal"
                [class.settings-pill--active]="settings.fontSize() === 'md'"
                (click)="setFontSize('md')">
                A
              </button>
              <button
                class="settings-pill settings-pill--font"
                title="Grande"
                [class.settings-pill--active]="settings.fontSize() === 'lg'"
                (click)="setFontSize('lg')">
                A+
              </button>
            </div>
          </div>
          <div class="profile-menu__divider"></div>
          <button class="profile-menu__item profile-menu__item--danger" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar Sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
