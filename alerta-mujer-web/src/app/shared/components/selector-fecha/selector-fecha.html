<button type="button" class="sf-campo" [class.sf-campo--abierto]="abierto()" [attr.aria-label]="etiqueta() + ': ' + (texto() || 'sin elegir')"
        aria-haspopup="dialog" [attr.aria-expanded]="abierto()" (click)="alternar()">
  <svg class="sf-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
  </svg>
  <span class="sf-texto" [class.sf-texto--vacio]="!texto()">{{ texto() || placeholder() }}</span>
  @if (limpiable() && seleccion()) {
    <span class="sf-limpiar" role="button" tabindex="0" aria-label="Quitar la fecha" (click)="limpiar($event)" (keydown.enter)="limpiar($event)">✕</span>
  }
</button>

@if (abierto()) {
  <div class="sf-panel" role="dialog" [attr.aria-label]="etiqueta()">
    <div class="sf-cabecera">
      <button type="button" class="sf-nav" aria-label="Mes anterior" (click)="moverMes(-1)">‹</button>
      <span class="sf-mes">{{ tituloMes() }}</span>
      <button type="button" class="sf-nav" aria-label="Mes siguiente" (click)="moverMes(1)">›</button>
    </div>
    <div class="sf-grilla">
      @for (d of dias; track $index) { <span class="sf-dia-semana">{{ d }}</span> }
      @for (c of celdas(); track c.iso) {
        <button type="button" class="sf-dia"
                [class.sf-dia--fuera]="!c.delMes" [class.sf-dia--hoy]="c.hoy" [class.sf-dia--elegido]="c.iso === seleccion()"
                [disabled]="c.deshabilitada" [attr.aria-label]="c.iso" [attr.aria-pressed]="c.iso === seleccion()"
                (click)="elegir(c)">{{ c.dia }}</button>
      }
    </div>
    <div class="sf-pie">
      <button type="button" class="sf-accion" (click)="hoy()">Hoy</button>
      @if (limpiable()) {
        <button type="button" class="sf-accion sf-accion--suave" (click)="limpiar()">Quitar</button>
      }
    </div>
  </div>
}
