# Tests and builds the Angular web on every push and pull request.
name: CI

on:
  push:
    branches: [develop, qa, main, feature/audit-cleanup-google-signin]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alerta-mujer-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alerta-mujer-web/package-lock.json
      - run: npm ci
      - name: Tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build
